<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Tells the browser this page fully supports both schemes on its own, so
      mobile Chrome's "force dark" doesn't try to auto-invert/darken it on
      top of our own theme (which produces a muddy, semi-black look).
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#150826" />
    <title>Eurovision Family Contest</title>
    <script>
      // Applied synchronously, before the page paints, so there's no flash of
      // the wrong theme while React loads and reconciles the saved choice.
      try {
        if (localStorage.getItem('efc-theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      } catch (e) {}

      // Registered here (before any of our own module code, and therefore
      // before Firebase's own SDK code, ever runs) so it's guaranteed to be
      // listening before Firebase Auth/Firestore's background housekeeping
      // requests can reject. Those retry silently on their own - a transient
      // "Failed to fetch" from them isn't an app bug, just noisy to leave
      // showing as a scary uncaught error in the console.
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason
        var message = reason && reason.message ? reason.message : String(reason)
        if (message.indexOf('Failed to fetch') !== -1) {
          event.preventDefault()
        }
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
